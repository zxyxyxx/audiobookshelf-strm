name: Auto Update STRM from Upstream

# 定时轮询官方 advplyr/audiobookshelf 的最新 release，
# 自动把 strm 定制改动 rebase 到最新版本、打 tag 并触发镜像构建。
# - 无新版本：什么都不做。
# - 有新版本且无冲突：自动更新 strm 分支 + 打 strm-vX.Y.Z tag + 构建推送镜像。
# - 有冲突：中止、不破坏代码，并自动开 issue 提醒你人工 rebase 一次。

on:
  schedule:
    - cron: '0 */2 * * *'   # 每 2 小时检查一次（公开仓库 Actions 免费，可自行调整）
  workflow_dispatch:        # 也支持在 Actions 页手动触发

concurrency:
  group: auto-update-strm
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-24.04
    outputs:
      updated: ${{ steps.rebase.outputs.updated }}
      version: ${{ steps.rebase.outputs.version }}
      strmtag: ${{ steps.rebase.outputs.strmtag }}
    steps:
      - name: 检出 strm 分支（含完整历史）
        uses: actions/checkout@v4
        with:
          ref: strm
          fetch-depth: 0

      # 固定 Node 版本：runner 自带的 Node 版本会把 `node --test <dir>` 当成
      # 模块去 require，导致 "Cannot find module .../strm-test" 而误判测试失败。
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 配置 git 身份
        run: |
          git config user.name "strm-auto-update[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 添加 upstream 并拉取官方 tags
        run: |
          git remote add upstream https://github.com/advplyr/audiobookshelf.git || true
          git fetch upstream --tags --force --quiet

      - name: 获取官方最新发布版本
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          L=$(gh api repos/advplyr/audiobookshelf/releases/latest --jq .tag_name)
          echo "官方最新 release: $L"
          echo "tag=$L" >> "$GITHUB_OUTPUT"

      - name: rebase 定制改动到最新版本
        id: rebase
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          L="${{ steps.latest.outputs.tag }}"     # 例如 v2.36.0
          VER="${L#v}"                            # 2.36.0
          STRMTAG="strm-${L}"                     # strm-v2.36.0
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "strmtag=$STRMTAG" >> "$GITHUB_OUTPUT"
          echo "updated=false" >> "$GITHUB_OUTPUT"

          # 已经构建过该版本 -> 跳过
          if git ls-remote --exit-code --tags origin "refs/tags/$STRMTAG" >/dev/null 2>&1; then
            echo "✅ $STRMTAG 已存在，已是最新，无需更新"
            exit 0
          fi

          # 官方 tag 必须存在
          if ! git rev-parse -q --verify "refs/tags/$L" >/dev/null; then
            echo "Official tag $L was not found; skipping"
            exit 0
          fi

          git checkout strm
          BASE_SHA=$(git rev-parse HEAD)

          # 同版本若已有未关闭的 issue 则不重复创建
          open_issue() {
            local TITLE="$1"
            local BODY="$2"
            local EXIST
            EXIST=$(gh issue list --state open --search "\"$L\" in:title" --json number --jq 'length')
            if [ "$EXIST" = "0" ]; then
              gh issue create --title "$TITLE" --body "$BODY"
            fi
          }

          if ! git rebase "$L"; then
            git rebase --abort || true
            echo "❌ rebase 到 $L 出现冲突，已中止，未改动 strm"
            BODY="自动把 strm 定制改动 rebase 到官方 \`$L\` 时发生**冲突**，已自动中止（strm 分支未被改动，镜像不受影响）。"
            BODY="$BODY"$'\n\n'"请在本地解决一次冲突："
            BODY="$BODY"$'\n```bash\n'"cd abs-strm"$'\n'"git fetch upstream --tags"$'\n'"git checkout strm"$'\n'"git rebase $L"$'\n'"# 手动解决冲突后："$'\n'"git add <冲突文件>"$'\n'"git rebase --continue"$'\n'"node --test strm-test/*.test.js"$'\n'"git tag $STRMTAG"$'\n'"git push origin strm --force-with-lease"$'\n'"git push origin $STRMTAG"$'\n```'
            BODY="$BODY"$'\n\n'"推送后会自动构建并推送镜像 \`$VER\` + \`latest\`。"
            open_issue "⚠️ 自动更新冲突：官方 $L 需人工 rebase" "$BODY"
            exit 0
          fi

          # 门禁：rebase 无冲突不代表 STRM 补丁的语义还成立（上游可能重构了扫描器、
          # 播放会话或 Stream 转码逻辑）。冒烟测试失败就回滚，绝不推送一个坏镜像。
          if ! node --test strm-test/*.test.js; then
            git reset --hard "$BASE_SHA"
            echo "❌ rebase 到 $L 后 STRM 冒烟测试失败，已回滚到 $BASE_SHA，未推送"
            BODY="rebase 到官方 \`$L\` **没有冲突**，但 STRM 冒烟测试（\`node --test strm-test/*.test.js\`）失败，已自动回滚，strm 分支与镜像均未改动。"
            BODY="$BODY"$'\n\n'"这通常意味着上游重构了 STRM 依赖的代码路径（扫描器 / PlaybackSessionManager / Stream / ffmpegHelpers）。"
            BODY="$BODY"$'\n\n'"本地排查："$'\n```bash\n'"cd abs-strm"$'\n'"git fetch upstream --tags"$'\n'"git checkout strm"$'\n'"git rebase $L"$'\n'"node --test strm-test/*.test.js"$'\n```'
            open_issue "⚠️ STRM 冒烟测试失败：官方 $L" "$BODY"
            exit 0
          fi

          git tag "$STRMTAG"
          if ! git push origin strm --force-with-lease; then
            git tag -d "$STRMTAG" || true
            echo "❌ 推送 strm 失败（分支保护 / 规则集 / 网络）"
            BODY="rebase 到官方 \`$L\` 成功、冒烟测试也通过，但 **推送 strm 失败**，已删掉本地 tag，分支与镜像均未改动。"
            BODY="$BODY"$'\n\n'"常见原因：分支保护或规则集禁止 force push、GITHUB_TOKEN 权限不足、GitHub 临时故障（\`fatal error in commit_refs_rules\` 就是后者，重跑即可）。"
            BODY="$BODY"$'\n\n'"本地手动推送："$'\n```bash\n'"cd abs-strm"$'\n'"git fetch upstream --tags"$'\n'"git checkout strm"$'\n'"git rebase $L"$'\n'"node --test strm-test/*.test.js"$'\n'"git tag $STRMTAG"$'\n'"git push origin strm --force-with-lease"$'\n'"git push origin $STRMTAG"$'\n```'
            open_issue "⚠️ 推送 strm 失败：官方 $L" "$BODY"
            exit 0
          fi
          if ! git push origin "$STRMTAG"; then
            echo "❌ tag 推送失败（分支已更新）"
            open_issue "⚠️ 推送 tag 失败：$STRMTAG" "分支 strm 已更新到官方 \`$L\`，但 tag \`$STRMTAG\` 推送失败，镜像未构建。手动补推：\`git push origin $STRMTAG\`"
            exit 0
          fi
          sed -i "s/updated=false/updated=true/" "$GITHUB_OUTPUT"
          echo "🎉 已把定制改动更新到 $L 并打 tag $STRMTAG"

  build:
    needs: update
    if: needs.update.outputs.updated == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-strm-image.yml
    with:
      ref: ${{ needs.update.outputs.strmtag }}
      image_tag: ${{ needs.update.outputs.version }}
