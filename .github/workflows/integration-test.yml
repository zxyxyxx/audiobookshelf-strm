name: Integration Test

on:
  pull_request:
  push:
    branches-ignore:
      - 'dependabot/**' # Don't run dependabot branches, as they are already covered by pull requests
    # Only build when files in these directories have been changed
    paths:
      - client/**
      - server/**
      - test/**
      - index.js
      - package.json
      - tsconfig.server.json

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: install pkg (using yao-pkg fork for targeting node24)
        run: npm install -g @yao-pkg/pkg

      - name: get client dependencies
        working-directory: client
        run: npm ci

      - name: build client
        working-directory: client
        run: npm run generate

      - name: get server dependencies and compile server
        run: npm ci && npm run build:server && npm prune --omit=dev

      - name: build binary
        run: pkg --config package.json -t node24-linux-x64 -o audiobookshelf dist-server/index.js

      # STRM fork: index.js/prod.js default to PORT 2048 (upstream uses 3333).
      # Pin the port here so this job keeps testing what it was written for.
      - name: run audiobookshelf
        run: |
          PORT=3333 ./audiobookshelf &
          sleep 5

      - name: test if server is available
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:3333 | grep -qi audiobookshelf; then
              echo "server is up after ${i} attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "server did not come up on http://127.0.0.1:3333" >&2
          exit 1
